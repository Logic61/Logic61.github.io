<div class="container">
    <h1>🌸 年度男娘程度总结器 🌸</h1>
    <p class="subtitle">输入你的昵称，测测你的男娘指数吧！</p>

<pre><code>&lt;input type=&quot;text&quot; id=&quot;nameInput&quot; placeholder=&quot;请输入你的昵称&quot;&gt;

&lt;div id=&quot;resultArea&quot; class=&quot;result-section&quot;&gt;
    &lt;div class=&quot;flower-icon&quot;&gt;🌸&lt;/div&gt;
    &lt;div class=&quot;score&quot; id=&quot;scoreValue&quot;&gt;0 分&lt;/div&gt;
    &lt;div class=&quot;rank&quot; id=&quot;rankText&quot;&gt;SSS级男娘&lt;/div&gt;
    &lt;p class=&quot;comment&quot; id=&quot;commentText&quot;&gt;&lt;/p&gt;
    
    &lt;div class=&quot;progress-bar&quot;&gt;
        &lt;div class=&quot;progress-fill&quot; id=&quot;progressFill&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
&lt;/div&gt;

&lt;button onclick=&quot;calculateScore()&quot; id=&quot;btnText&quot;&gt;开始测试&lt;/button&gt;

&lt;p class=&quot;footer-tip&quot;&gt;💡 提示：相同的昵称会得到相同的结果哦&lt;/p&gt;
</code></pre>
</div>

<script>
    function calculateScore() {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) {
            alert("请输入名字哦！");
            return;
        }

        let score = 0;

        // 特殊名单逻辑
        if (name === "邹旻珂" || name === "黄翊航") {
            score = 100;
        } else {
            // 简单算法：根据字符编码生成固定分数（保证同一个名字分数一致）
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            score = Math.abs(hash % 101); // 生成 0-100 的随机数
        }

        // 显示结果区域
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('scoreValue').innerText = score + " 分";
        document.getElementById('progressFill').style.width = score + "%";
        
        // 设置评语和等级
        let rank = "";
        let comment = "";
        
        if (score >= 95) {
            rank = "SSS级男娘";
            comment = "恭喜你！你已经达到了男娘的最高境界，萌力爆表！💖";
        } else if (score >= 80) {
            rank = "极品男娘";
            comment = "非常可爱！你散发着令人无法抗拒的魅力~✨";
        } else if (score >= 60) {
            rank = "资深男娘";
            comment = "已经很熟练了呢，继续加油呀！";
        } else {
            rank = "新手男娘";
            comment = "还有很大的提升空间，尝试一下穿上裙子吧？";
        }

        document.getElementById('rankText').innerText = rank;
        document.getElementById('commentText').innerText = comment;
        document.getElementById('btnText').innerText = "重新测试";
    }
</script>
